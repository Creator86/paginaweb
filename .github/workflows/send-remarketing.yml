name: Sync Leads to MailerLite

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sincronizar leads Supabase a MailerLite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
        run: node scripts/send-remarketing.mjs
