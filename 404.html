<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — NexusFlow Production Site</title>
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--wf-color-background, #ffffff);
      color: var(--wf-color-text, #0f172a);
      text-align: center;
      padding: 2rem;
    }
    .card {
      max-width: 540px;
      padding: 3rem 2rem;
      border: 1px solid var(--wf-color-border, #e2e8f0);
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05);
    }
    h1 { font-size: 4rem; margin: 0 0 1rem; color: var(--wf-color-primary, #2563eb); }
    p { font-size: 1.1rem; color: var(--wf-color-text-muted, #64748b); line-height: 1.5; margin-bottom: 2rem; }
    a.btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: var(--wf-color-primary, #2563eb);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>La página que estás buscando no existe o ha sido movida.</p>
    <a href="./" class="btn">Volver al Inicio</a>
  </div>
</body>
</html>
